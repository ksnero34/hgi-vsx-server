nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

server:
  replicaCount: 1
  image:
    repository: harbor.hwgeneralins.com/hgi-vsx/openvsx-server
    tag: "0.31.0"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  env:
    PUBLIC_BASE_URL: "https://vsx.hgi.com:28443"
    OVSX_REGISTRY_URL: "http://vsx.hgi.com"
    OVSX_ELASTICSEARCH_HOST: "{{ include \"hgi-vsx.fullname\" . }}-elasticsearch:9200"
    SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ include \"hgi-vsx.fullname\" . }}-postgres:5432/postgres"
    SPRING_DATASOURCE_USERNAME: "openvsx"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CUSTOM_CLIENT_ID: "92a17cbc-909c-41bb-880e-ce58685da4e4"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CUSTOM_CLIENT_NAME: "HGI-OIDC"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CUSTOM_SCOPE: "openid,profile,email"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CUSTOM_REDIRECT_URI: "https://vsx.hgi.com:28443/login/oauth2/code/custom"
    SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_CUSTOM_ISSUER_URI: "http://auth.hwgeneralins.com"
    OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_LOGIN_NAME: "sub"
    OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_FULL_NAME: "name"
    OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_EMAIL: "email"
    OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_AVATAR_URL: "picture"
    OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_PROVIDER_URL: "iss"
    SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration"
  secretEnv:
    SPRING_DATASOURCE_PASSWORD: "openvsx"
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_CUSTOM_CLIENT_SECRET: "replace-me"
  storage:
    enabled: true
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
  extraEnv: []
  hostAliases: []
  resources: {}

webui:
  replicaCount: 1
  image:
    repository: harbor.hwgeneralins.com/hgi-vsx/openvsx-webui
    tag: "0.31.0"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  hostAliases: []
  resources: {}

proxy:
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    ports:
      http: 80
      https: 443
    nodePorts: {}
  tls:
    enabled: true
    create: true
    existingSecret: ""
    crt: ""
    key: ""
  clientMaxBodySize: "200m"
  hostAliases: []
  resources: {}

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "latest"
    pullPolicy: IfNotPresent
  auth:
    username: openvsx
    password: openvsx
    database: postgres
  service:
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
  resources: {}

elasticsearch:
  enabled: true
  image:
    repository: elasticsearch
    tag: "8.7.1"
    pullPolicy: IfNotPresent
  service:
    port: 9200
  env:
    xpack.security.enabled: "false"
    xpack.ml.enabled: "false"
    discovery.type: "single-node"
    bootstrap.memory_lock: "true"
    cluster.routing.allocation.disk.threshold_enabled: "false"
    ES_JAVA_OPTS: "-Xms512m -Xmx512m"
  persistence:
    enabled: true
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
  sysctlInit:
    enabled: false
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
  resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
