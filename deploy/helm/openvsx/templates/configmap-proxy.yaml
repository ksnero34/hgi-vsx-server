apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hgi-vsx.fullname" . }}-proxy
  labels:
    {{- include "hgi-vsx.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  nginx.conf: |
    events {}

    http {
        upstream webui {
            server {{ include "hgi-vsx.fullname" . }}-webui:{{ .Values.webui.service.port }};
        }

        upstream ovsx_server {
            server {{ include "hgi-vsx.fullname" . }}-server:{{ .Values.server.service.port }};
        }

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen {{ .Values.proxy.service.ports.http }};
{{- if .Values.proxy.tls.enabled }}
            listen {{ .Values.proxy.service.ports.https }} ssl;

            ssl_certificate /etc/nginx/ssl/nginx.crt;
            ssl_certificate_key /etc/nginx/ssl/nginx.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
{{- end }}
            server_name _;

            client_max_body_size {{ .Values.proxy.clientMaxBodySize }};

            location ~ ^/(api|user|admin|oauth2|login|logout|documents|vscode|actuator|swagger-ui|login-providers|error)(/|$) {
                proxy_pass http://ovsx_server$request_uri;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
            }

            location / {
                proxy_pass http://webui;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
