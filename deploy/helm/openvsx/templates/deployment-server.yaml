apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hgi-vsx.fullname" . }}-server
  labels:
    {{- include "hgi-vsx.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "hgi-vsx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "hgi-vsx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml .Values.imagePullSecrets | nindent 8 }}
{{- end }}
{{- if .Values.server.hostAliases }}
      hostAliases:
{{- toYaml .Values.server.hostAliases | nindent 8 }}
{{- end }}
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "hgi-vsx.fullname" . }}-server-env
            - secretRef:
                name: {{ include "hgi-vsx.fullname" . }}-server-env
{{- if .Values.server.extraEnv }}
          env:
{{- toYaml .Values.server.extraEnv | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: storage
              mountPath: /var/openvsx/storage
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
{{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: storage
{{- if .Values.server.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hgi-vsx.fullname" . }}-storage
{{- else }}
          emptyDir: {}
{{- end }}
      nodeSelector:
{{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
{{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
{{- toYaml .Values.affinity | nindent 8 }}
