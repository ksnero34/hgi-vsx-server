apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hgi-vsx.fullname" . }}-server-env
  labels:
    {{- include "hgi-vsx.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
{{- range $key, $value := .Values.server.env }}
  {{ $key }}: {{ tpl $value $ | quote }}
{{- end }}
