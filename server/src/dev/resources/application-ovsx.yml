ovsx:
  webui:
    url: ${OVSX_WEBUI_URL:http://webui:3000}
  elasticsearch:
    host: ${OVSX_ELASTICSEARCH_HOST:elasticsearch:9200}
  oauth2:
    attribute-names:
      custom:
        avatar-url: ${OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_AVATAR_URL:picture}
        email: ${OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_EMAIL:email}
        full-name: ${OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_FULL_NAME:name}
        login-name: ${OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_LOGIN_NAME:given_name}
        provider-url: ${OVSX_OAUTH2_ATTRIBUTE_NAMES_CUSTOM_PROVIDER_URL:iss}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:openvsx}
    password: ${SPRING_DATASOURCE_PASSWORD:openvsx}
